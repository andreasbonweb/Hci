<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCI Exam Drill</title>
<style>
:root{--bg:#0f1419;--card:#1a212b;--tx:#e8edf2;--mu:#8b98a5;--ok:#1f9d63;--no:#d1495b;--ac:#4c8dff}
@media(prefers-color-scheme:light){:root{--bg:#f2f4f7;--card:#fff;--tx:#18202a;--mu:#5d6b79}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:16px}
main{max-width:720px;margin:auto}
#st{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mu);margin-bottom:12px}
#st b{color:var(--tx)}#st span{background:var(--card);padding:4px 10px;border-radius:99px}
.card{background:var(--card);border-radius:14px;padding:20px}
#q{font-size:19px;font-weight:600;margin:0 0 16px}
.o{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border:1.5px solid var(--mu);border-radius:10px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--ac)}.o:disabled{cursor:default}
.o.c{border-color:var(--ok);background:rgba(31,157,99,.18)}.o.w{border-color:var(--no);background:rgba(209,73,91,.18)}
#fb{margin-top:14px;font-size:14px}#fb p{margin:6px 0}#fb .h{font-weight:700;font-size:16px}
#fb small{color:var(--mu);display:block}
.btn{margin-top:14px;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 20px;font:inherit;cursor:pointer}
.r{background:transparent;color:var(--mu);border:1px solid var(--mu);float:right;margin:0;padding:2px 10px;font-size:12px}
</style></head><body><main>
<div id="st"></div>
<div class="card"><p id="q"></p><div id="os"></div><div id="fb"></div><button class="btn" id="nx" hidden>Next ▸ (Enter)</button></div>
<p style="font-size:12px;color:var(--mu)">Keys 1–4 answer · Enter next. Wrong answers return in ~3 turns; correct ones move to longer review intervals and never leave the loop.

</main>

const $=id=>document.getElementById(id),K="hciDrill1",INT=[4,10,25,60,150];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.q)S={turn:0,q:{},tot:0,ok:0,streak:0};
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const st=i=>S.q[i]||(S.q[i]={box:0,due:0,seen:0});
let cur=-1,last=-1,locked=false,opts=[];
function pick(){
  let best=[],bs=1e9;
  Q.forEach((_,i)=>{if(i===last)return;const s=st(i);
    const k=s.seen&&s.due<=S.turn?s.box/10:!s.seen?1:2+s.due/1e4;
    if(k<bs-1e-9){bs=k;best=[i]}else if(Math.abs(k-bs)<1e-9)best.push(i)});
  return best[Math.floor(Math.random()*best.length)];
}
function stats(){
  const seen=Object.values(S.q).filter(x=>x.seen).length,m=Object.values(S.q).filter(x=>x.box>=3).length;
  $("st").innerHTML=`<span>Seen <b>${seen}/${Q.length}</b></span><span>Mastered <b>${m}</b></span><span>Accuracy <b>${S.tot?Math.round(100*S.ok/S.tot):0}%</b></span><span>Streak <b>${S.streak}</b></span>`;
}
function show(){
  cur=pick();const q=Q[cur];locked=false;
  opts=q.slice(1).map((t,i)=>({t,c:i===0}));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
  $("q").textContent=q[0];$("fb").innerHTML="";$("nx").hidden=true;
  $("os").innerHTML="";
  opts.forEach((o,i)=>{const b=document.createElement("button");b.className="o";b.textContent=(i+1)+". "+o.t;b.onclick=()=>ans(i);$("os").appendChild(b)});
  stats();
}
function ans(i){
  if(locked)return;locked=true;
  const q=Q[cur],o=opts[i],s=st(cur),bs=[...document.querySelectorAll(".o")];
  S.turn++;S.tot++;s.seen++;
  if(o.c){S.ok++;S.streak++;s.box=Math.min(s.box+1,5);s.due=S.turn+INT[s.box-1]}
  else{S.streak=0;s.box=0;s.due=S.turn+3}
  opts.forEach((x,j)=>{if(x.c)bs[j].classList.add("c");else if(j===i)bs[j].classList.add("w");bs[j].disabled=true});
  let h=`<p class="h">${o.c?"✔ Correct":"✘ Incorrect"}</p><p><b>${q[1]}</b> — ${T[q[1]]}. This fits the prompt “${q[0]}”.</p>`;
  if(!o.c)h+=`<p><b>${o.t}</b> — ${T[o.t]}. It does not match this prompt, so it is not the answer here.</p>`;
  const rest=q.slice(2).filter(x=>x!==o.t);
  h+=`<small>${o.c?"Why the others don’t fit:":"Other options:"}<br>`+rest.map(x=>`• <b>${x}</b> — ${T[x]}.`).join("<br>")+"</small>";
  $("fb").innerHTML=h;$("nx").hidden=false;$("nx").focus();sv();stats();
}
$("nx").onclick=()=>{last=cur;show()};
$("rs").onclick=()=>{if(confirm("Reset all progress?")){S={turn:0,q:{},tot:0,ok:0,streak:0};sv();last=-1;show()}};
document.onkeydown=e=>{if(e.key>="1"&&e.key<="4")ans(+e.key-1);else if(e.key==="Enter"&&locked){e.preventDefault();$("nx").click()}};
show();
</script></body></html>
